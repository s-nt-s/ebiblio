[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ebiblio-client"
version = "1.0.0"
description = "Cliente Python sin dependencias externas para buscar en catálogos eBiblio compatibles."
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "eBiblio Client contributors" }]
dependencies = []

[project.urls]
Homepage = "https://github.com/s-nt-s/ebiblio"
Repository = "https://github.com/s-nt-s/ebiblio"
Issues = "https://github.com/s-nt-s/ebiblio/issues"

[project.scripts]
ebiblio = "ebiblio.cli:main"
ebiblio-server = "ebiblio.server:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]